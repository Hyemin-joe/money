<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>money friend</title>
  <meta name="apple-mobile-web-app-title" content="money friend" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="contact">
        <div class="avatar"><img src="/apple-touch-icon.png" alt="" /></div>
        <div class="name">money friend <span class="chev">›</span></div>
      </div>
      <button class="link-btn stats-open" id="openStats">통계</button>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <form class="composer" id="composer" autocomplete="off">
      <!-- 사진 기능은 잠시 숨김: 다시 켜려면 아래 hidden 을 지우세요 -->
      <button type="button" class="icon-btn" id="photoBtn" aria-label="사진 보내기" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9.4 4h5.2l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2.9l1.5-2Zm2.6 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 1.8a2.7 2.7 0 1 1 0 5.4 2.7 2.7 0 0 1 0-5.4Z"/></svg>
      </button>
      <input type="file" id="photoInput" accept="image/*" hidden />
      <div class="field">
        <input id="text" type="text" placeholder="어디서 얼마 썼어?" enterkeyhint="send" />
        <button type="submit" class="send" id="sendBtn" aria-label="보내기" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4.5 5.3 11.2l1.4 1.4L11 8.3V20h2V8.3l4.3 4.3 1.4-1.4L12 4.5Z"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- 통계 화면 -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <header class="sheet-bar">
      <span></span>
      <h2>통계</h2>
      <button class="link-btn bold" id="closeStats">완료</button>
    </header>
    <div class="sheet-body">
      <div class="segmented" role="tablist">
        <button data-period="week">주</button>
        <button data-period="month" class="on">월</button>
        <button data-period="year">년</button>
      </div>
      <div class="period-nav">
        <button class="link-btn" id="prev" aria-label="이전">‹</button>
        <span id="periodLabel"></span>
        <button class="link-btn" id="next" aria-label="다음">›</button>
      </div>

      <div class="summary">
        <div class="sum-label">쓴 돈</div>
        <div class="sum-big" id="sumExpense">0원</div>
        <div class="sum-sub">들어온 돈 <b id="sumIncome">0원</b></div>
      </div>

      <h3>카테고리별 지출</h3>
      <div class="stack" id="catStack"></div>
      <ul class="list" id="catList"></ul>
      <p class="hint" id="catHint" hidden>카테고리를 누르면 그 내역만 볼 수 있어</p>

      <h3>자주 쓴 곳</h3>
      <ul class="list" id="placeList"></ul>

      <h3 id="entryTitle">전체 내역</h3>
      <div id="entryList"></div>

      <h3 class="local-only">내 기록 보관</h3>
      <ul class="list local-only">
        <li class="row">
          <span>백업 파일로 저장</span>
          <button class="pill" id="exportBtn">저장</button>
        </li>
        <li class="row">
          <span>백업 파일 불러오기</span>
          <button class="pill" id="importBtn">불러오기</button>
        </li>
      </ul>
      <input type="file" id="importInput" accept="application/json,.json" hidden />

      <h3 class="server-only">알림</h3>
      <ul class="list server-only">
        <li class="row">
          <span>밤 9시 알림</span>
          <button class="pill" id="notifyBtn">켜기</button>
        </li>
        <li class="row">
          <span>지금 알림 한번 받아보기</span>
          <button class="pill" id="testPush">테스트</button>
        </li>
      </ul>
      <p class="foot" id="aiState"></p>
    </div>
  </section>

  <script type="module" src="/boot.js"></script>
</body>
</html>
